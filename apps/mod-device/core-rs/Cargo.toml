[package]
name = "mod-core"
version = "0.1.0"
edition = "2021"
description = "JamConnect Mod Device modulation core (WebAssembly, plain C ABI)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
