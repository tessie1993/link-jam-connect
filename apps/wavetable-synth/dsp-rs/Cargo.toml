[package]
name = "jc_wavetable_synth"
version = "0.1.0"
edition = "2021"
description = "JamConnect wavetable synth DSP engine (WebAssembly, plain C ABI, no wasm-bindgen)"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "unwind"
