name: Build & test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synth-wasm:
    name: wavetable synth engine (Rust -> wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/wavetable-synth/dsp-rs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: cargo test (native)
        working-directory: apps/wavetable-synth/dsp-rs
        run: cargo test

      - name: cargo build (wasm32-unknown-unknown)
        working-directory: apps/wavetable-synth/dsp-rs
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Copy (and optimise with wasm-opt when available)
        run: |
          src=apps/wavetable-synth/dsp-rs/target/wasm32-unknown-unknown/release/jc_wavetable_synth.wasm
          dst=apps/wavetable-synth/engine/synth.wasm
          mkdir -p apps/wavetable-synth/engine
          if command -v wasm-opt >/dev/null 2>&1 && wasm-opt -O3 "$src" -o "$dst"; then echo "wasm-opt applied"; else cp "$src" "$dst"; fi
          ls -l "$dst"

      - uses: actions/upload-artifact@v4
        with:
          name: synth-wasm
          path: apps/wavetable-synth/engine/synth.wasm

      - name: Synth test against the real wasm (worklet offline, no browser)
        run: node tests/wavetable-synth.mjs --config jamconnect.config.json --require-wasm
        timeout-minutes: 5

  bridge:
    name: bridge (${{ matrix.os }})
    needs: synth-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure
        run: cmake -S bridge -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Syntax check JS / config
        run: |
          node --check JamConnect/jamconnect.js
          node --check webapp/app.js
          node --check m4l/jamconnect-m4l.js
          node --check m4l/jamconnect-live.js
          node --check apps/common/jcapp.js
          node --check apps/live-control/app.js
          node --check apps/m4l-controller/app.js
          for f in apps/wavetable-synth/*.js apps/wavetable-synth/dsp/*.js apps/wavetable-synth/worklet/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('jamconnect.config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/wavetable-synth/presets/factory.json','utf8'))"

      - name: WebRTC session + Link clock sync test (no binaries)
        run: node tests/webrtc-sync.mjs --config jamconnect.config.json
        timeout-minutes: 3

      - name: Live API connector test (mocked LiveAPI / Max, no binaries)
        run: node tests/live-control.mjs --config jamconnect.config.json
        timeout-minutes: 3

      - name: Max for Live device test (M4L_*, mocked max-api / LiveAPI, no binaries)
        run: node tests/m4l-controller.mjs --config jamconnect.config.json
        timeout-minutes: 3

      - name: Integration test (Link peer <-> bridge <-> JamConnect)
        run: node tests/integration.mjs --bin build --config jamconnect.config.json
        timeout-minutes: 3

      - name: Wavetable synth engine (built by synth-wasm)
        uses: actions/download-artifact@v4
        with:
          name: synth-wasm
          path: apps/wavetable-synth/engine

      - name: Package
        shell: bash
        run: |
          set -e
          out=dist/jamconnect-link-${{ matrix.platform }}
          mkdir -p "$out/webapp"
          if [ -f build/Release/jamlink-bridge.exe ]; then cp build/Release/*.exe "$out/"; \
          elif [ -f build/jamlink-bridge.exe ]; then cp build/*.exe "$out/"; \
          else cp build/jamlink-bridge build/linkpeer "$out/"; fi
          cp webapp/* "$out/webapp/"
          cp -r apps "$out/apps"
          cp JamConnect/jamconnect.js "$out/webapp/"
          python3 m4l/build_device.py "$out/m4l" || python m4l/build_device.py "$out/m4l"
          cp m4l/*.js "$out/m4l/"
          cp README.md PROTOCOL.md jamconnect.config.json "$out/"
          cd dist && (7z a -tzip "jamconnect-link-${{ matrix.platform }}.zip" "jamconnect-link-${{ matrix.platform }}" >/dev/null 2>&1 || zip -qr "jamconnect-link-${{ matrix.platform }}.zip" "jamconnect-link-${{ matrix.platform }}")

      - uses: actions/upload-artifact@v4
        with:
          name: jamconnect-link-${{ matrix.platform }}
          path: dist/jamconnect-link-${{ matrix.platform }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jamconnect-link-${{ matrix.platform }}.zip

  m4l-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Max for Live device
        run: |
          python3 m4l/build_device.py dist/m4l
          cp m4l/*.js dist/m4l/
          python3 - <<'EOF'
          import json, struct
          data = open('dist/m4l/JamConnectLink.amxd', 'rb').read()
          assert data[:4] == b'ampf' and data[8:12] == b'mmmm', 'bad amxd header'
          n = struct.unpack('<I', data[28:32])[0]
          patch = json.loads(data[32:32 + n].rstrip(b'\x00\n'))
          assert any('node.script' in b['box'].get('text', '') for b in patch['patcher']['boxes'])
          cfg = json.load(open('jamconnect.config.json'))
          dials = [b for b in patch['patcher']['boxes'] if b['box']['maxclass'] == 'live.dial']
          assert len(dials) == cfg['m4l']['macroCount'], 'macro dial count != m4l.macroCount'
          assert any(b['box'].get('text', '').startswith('pattr jc_mappings') for b in patch['patcher']['boxes'])
          print('amxd ok,', n, 'bytes of patcher')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: jamconnect-link-m4l
          path: dist/m4l
