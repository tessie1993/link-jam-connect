name: Publish web app

on:
  push:
    branches: [main]
    paths: ['webapp/**', 'apps/**', 'JamConnect/jamconnect.js', 'jamconnect.config.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the mod device core (Rust -> WebAssembly)
        working-directory: apps/mod-device/core-rs
        run: |
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../engine
          cp target/wasm32-unknown-unknown/release/mod_core.wasm ../engine/mod-core.wasm
      - name: Build the wavetable synth engine (Rust -> wasm)
        working-directory: apps/wavetable-synth/dsp-rs
        run: |
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../engine
          cp target/wasm32-unknown-unknown/release/jc_wavetable_synth.wasm ../engine/synth.wasm
          rm -rf target
      - name: Assemble site
        run: |
          mkdir -p _site
          cp webapp/* _site/
          cp -r apps _site/apps
          cp JamConnect/jamconnect.js _site/
          cp jamconnect.config.json _site/
          rm -rf _site/apps/mod-device/core-rs
          test -f _site/apps/mod-device/engine/mod-core.wasm
          test -f _site/apps/wavetable-synth/engine/synth.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
