name: Publish web app

on:
  push:
    branches: [main]
    paths: ['webapp/**', 'apps/**', 'JamConnect/jamconnect.js', 'jamconnect.config.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same build as ci.yml synth-wasm: native tests, wasm32 release build, optional wasm-opt, real-wasm test.
      - name: cargo test (native)
        working-directory: apps/wavetable-synth/dsp-rs
        run: cargo test
      - name: cargo build (wasm32-unknown-unknown)
        working-directory: apps/wavetable-synth/dsp-rs
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Copy (and optimise with wasm-opt when available)
        run: |
          src=apps/wavetable-synth/dsp-rs/target/wasm32-unknown-unknown/release/jc_wavetable_synth.wasm
          dst=apps/wavetable-synth/engine/synth.wasm
          mkdir -p apps/wavetable-synth/engine
          if command -v wasm-opt >/dev/null 2>&1 && wasm-opt -O3 "$src" -o "$dst"; then echo "wasm-opt applied"; else cp "$src" "$dst"; fi
          rm -rf apps/wavetable-synth/dsp-rs/target
      - name: Synth test against the real wasm
        run: node tests/wavetable-synth.mjs --config jamconnect.config.json --require-wasm
      - name: Assemble site
        run: |
          mkdir -p _site
          cp webapp/* _site/
          cp -r apps _site/apps
          rm -rf _site/apps/wavetable-synth/dsp-rs
          cp JamConnect/jamconnect.js _site/
          cp jamconnect.config.json _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
